<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f5">
  <meta name="description" content="Личный дневник мыслей, стихов и чувств.">
  <title>posts — E-diary</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .post-card {
      padding: 25px 0;
      border-bottom: 1px solid #e8e1dc;
    }

    .post-card:first-child {
      padding-top: 10px;
    }

    .post-date {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #998b83;
      margin-bottom: 12px;
    }

    .post-title {
      font-size: clamp(23px, 4vw, 30px);
      line-height: 1.4;
      font-weight: normal;
      margin: 0 0 10px;
    }

    .post-title a {
      color: inherit;
      text-decoration: none;
    }

    .post-title a:hover {
      color: #a67b75;
    }

    .post-excerpt {
      color: #817771;
      font-size: 15px;
      line-height: 1.8;
      margin: 0;
    }

    .page-intro {
      margin-bottom: 45px;
    }

    .page-intro h1 {
      font-size: clamp(36px, 7vw, 54px);
      font-weight: normal;
      margin-bottom: 12px;
    }

    .page-intro p {
      color: #817771;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="index.html">thoughts.</a>
  </header>

  <main>
    <section class="page-intro">
      <h1>posts</h1>
      <p>E-diary — пространство мыслей, чувств и слов.</p>
    </section>

    <section>
      <div class="posts-list">

        <article class="post-card">
          <p class="post-date">х</p>
          <h2 class="post-title">
            <a href="posts/first-post.html">
              х
            </a>
          </h2>
          <p class="post-excerpt">
            х
          </p>
        </article>

        <article class="post-card">
          <p class="post-date">х</p>
          <h2 class="post-title">
            <a href="posts/second-post.html">
              х
            </a>
          </h2>
          <p class="post-excerpt">
            х
          </p>
        </article>

      </div>
    </section>
  </main>

  <footer>
    thoughts. · Личное пространство для мыслей
  </footer>
</body>
</html>
