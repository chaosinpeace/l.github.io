
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f5">
  <title>Thoughts — E-diary</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf8f5;
      color: #38312f;
      font-family: Georgia, "Times New Roman", serif;
    }

    header {
      max-width: 720px;
      margin: 0 auto;
      padding: 30px 24px;
    }

    .logo {
      color: #38312f;
      text-decoration: none;
      font-size: 19px;
      letter-spacing: 1px;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 45px 24px 100px;
    }

    .intro {
      margin-bottom: 65px;
    }

    .intro h1 {
      margin: 0 0 15px;
      font-size: clamp(38px, 8vw, 56px);
      font-weight: normal;
      letter-spacing: -1.5px;
    }

    .intro p {
      color: #8c8179;
      font-size: 15px;
      line-height: 1.8;
    }

    .post {
      padding: 25px 0;
      border-bottom: 1px solid #e9e2dc;
    }

    .post-number {
      display: inline-block;
      color: #38312f;
      font-size: 30px;
      font-weight: normal;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .post-number:hover {
      color: #a17c72;
    }

    .date {
      margin: 0 0 12px;
      color: #a1948b;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 25px 24px 40px;
      color: #a1948b;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">thoughts.</a>
  </header>

  <main>

    <section class="intro">
      <h1>Thoughts</h1>
      <p>E-diary · личное пространство мыслей и чувств.</p>
    </section>

    <section class="post">
      <p class="date">01 / Запись</p>
      <a class="post-number" href="posts/first-post.html">12</a>
    </section>

    <section class="post">
      <p class="date">02 / Запись</p>
      <a class="post-number" href="posts/second-poem.html">32</a>
    </section>

  </main>

  <footer>
    thoughts. · E-diary
  </footer>

</body>
</html>
