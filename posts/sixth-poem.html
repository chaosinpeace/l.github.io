    <div class="poem">И каждая мысль возвращается снова,
И душа словно тонет в беззвездной тьме.
Чей-то голос шептал — уходи, будь готова,
Покинуть пределы, где тесно тебе.
Туда, где нет людей, ни тел, ни взгляда,
Лишь тишина и холодный простор.</div>
